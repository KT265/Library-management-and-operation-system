<!DOCTYPE html>
<html>
<head>
    <title>Tool Lỏ Lấy Token</title>
</head>
<body>
    <h2>Bấm nút dưới, đăng nhập xong F12 lên lấy Token!</h2>
    <button id="loginBtn" style="padding: 10px 20px; font-size: 16px;">Đăng Nhập Bằng Google</button>

    <script type="module">
        // Import Firebase từ CDN của Google
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // VÁT CÁI CONFIG Ở BƯỚC 1 CỦA MÀY VÀO ĐÂY:
        const firebaseConfig = {
            apiKey: "AIzaSyALuXQY1nSgg0QMw7D9zy2NB6u-Nyc8umM",
            authDomain: "management-for-library.firebaseapp.com",
            projectId: "management-for-library",
            storageBucket: "management-for-library.firebasestorage.app",
            messagingSenderId: "553315753053",
            appId: "1:553315753053:web:c761c45300a1fa4769c1b4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById("loginBtn").addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const token = await result.user.getIdToken();
                    console.log("============= COPY CÁI CHUỖI DƯỚI NÀY =============");
                    console.log(token);
                    document.body.innerHTML += `<p>Đăng nhập thành công! F12 mở tab Console lên copy Token đi thg bạn!</p>`;
                })
                .catch((error) => console.error("Lỗi cmnr:", error));
        });
    </script>
</body>
</html>
